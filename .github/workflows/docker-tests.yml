name: Docker isolated tests
on:
  workflow_dispatch:
    inputs:
      suite:
        description: unit o full (incluye instalación nativa)
        required: true
        default: unit
        type: choice
        options: [unit, full, native]
permissions:
  contents: read
concurrency:
  group: pxp-docker-selfhosted
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == 'SrLambda/pxp-harness' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: true
      - name: Una prueba por contenedor
        run: |
          python3 tools/test_docker.py --suite "$SUITE" \
            --report-dir "$RUNNER_TEMP/pxp-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Resultados sanitizados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pxp-docker-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
