[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxp-harness"
version = "0.1.0"
description = "A lightweight project context and mode launcher for Codex CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
pxp = "pxp_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
